[package]
name = "reaterm"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "A capability-scoped, read-only terminal command interface"
homepage = "https://reaterm.pro-genai.com/"
repository = "https://github.com/Pro-GenAI/ReaTerm"
documentation = "https://reaterm.pro-genai.com/#get-started"

[dependencies]
cap-std = "3.4"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
